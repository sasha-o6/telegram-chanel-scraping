services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telegram_scraper
      POSTGRES_USER: telegram_scraper
      POSTGRES_PASSWORD: telegram_scraper
    ports:
      - '5430:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telegram_scraper -d telegram_scraper']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://telegram_scraper:telegram_scraper@postgres:5432/telegram_scraper}
      BOT_TOKEN: ${BOT_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      GLOBAL_SCHEDULER_INTERVAL_MINUTES: ${GLOBAL_SCHEDULER_INTERVAL_MINUTES:-20}
      TELEGRAM_ADAPTER: ${TELEGRAM_ADAPTER:-gramjs}
      TDLIB_DATABASE_DIRECTORY: ${TDLIB_DATABASE_DIRECTORY:-/app/.tdlib}
      TDLIB_FILES_DIRECTORY: ${TDLIB_FILES_DIRECTORY:-/app/.tdlib-files}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate && npm start"

volumes:
  postgres-data:
